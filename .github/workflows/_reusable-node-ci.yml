name: Reusable Node service CI

on:
  workflow_call:
    inputs:
      service_path:
        required: true
        type: string

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.service_path }}
    steps:
      - uses: actions/checkout@v4

      - name: Check whether service is scaffolded
        id: scaffolded
        run: |
          if [ -f package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip (not yet scaffolded)
        if: steps.scaffolded.outputs.present == 'false'
        run: echo "::notice::${{ inputs.service_path }} has no package.json yet - skipping until the service is scaffolded."

      - name: Setup Node
        if: steps.scaffolded.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        if: steps.scaffolded.outputs.present == 'true'
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Lint
        if: steps.scaffolded.outputs.present == 'true'
        run: npm run lint --if-present

      - name: Build
        if: steps.scaffolded.outputs.present == 'true'
        run: npm run build --if-present

      - name: Test
        if: steps.scaffolded.outputs.present == 'true'
        run: npm test --if-present

      - name: Check for Dockerfile
        id: dockerized
        if: steps.scaffolded.outputs.present == 'true'
        run: |
          if [ -f Dockerfile ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine image name
        id: image
        if: steps.dockerized.outputs.present == 'true'
        run: echo "name=$(basename "${{ inputs.service_path }}")" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        if: steps.dockerized.outputs.present == 'true'
        run: docker build -t "${{ steps.image.outputs.name }}:${{ github.sha }}" .

      - name: Save Docker image
        if: steps.dockerized.outputs.present == 'true'
        run: docker save "${{ steps.image.outputs.name }}:${{ github.sha }}" | gzip > "${{ steps.image.outputs.name }}.tar.gz"

      - name: Upload image artifact
        if: steps.dockerized.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.image.outputs.name }}-image
          path: ${{ inputs.service_path }}/${{ steps.image.outputs.name }}.tar.gz
          retention-days: 14
