name: catch-all CI

# Runs on every PR to main regardless of which files changed.
# Produces the same "ci / build-and-test" check name as the service CI workflows so
# that PRs touching only planning artifacts (_bmad-output/, docs/, .claude/, etc.)
# are not permanently blocked by the branch ruleset's required status check.
#
# For service PRs, both this workflow and the relevant service CI workflow produce
# "ci / build-and-test"; GitHub requires ALL instances to pass, so a failing service
# CI still blocks the PR even though this check is always green.

on:
  pull_request:
    branches: [main]

jobs:
  ci:
    uses: ./.github/workflows/_reusable-pass.yml
