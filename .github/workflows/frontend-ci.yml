name: frontend CI

on:
  push:
    paths:
      - 'services/frontend/**'
      - '.github/workflows/frontend-ci.yml'
      - '.github/workflows/_reusable-node-ci.yml'
  pull_request:
    paths:
      - 'services/frontend/**'
      - '.github/workflows/frontend-ci.yml'
      - '.github/workflows/_reusable-node-ci.yml'

jobs:
  ci:
    uses: ./.github/workflows/_reusable-node-ci.yml
    with:
      service_path: services/frontend
