name: auth-service CI

on:
  push:
    paths:
      - 'services/auth-service/**'
      - '.github/workflows/auth-service-ci.yml'
      - '.github/workflows/_reusable-dotnet-ci.yml'
  pull_request:
    paths:
      - 'services/auth-service/**'
      - '.github/workflows/auth-service-ci.yml'
      - '.github/workflows/_reusable-dotnet-ci.yml'

jobs:
  ci:
    uses: ./.github/workflows/_reusable-dotnet-ci.yml
    with:
      service_path: services/auth-service
