name: access-control-service CI

on:
  push:
    paths:
      - 'services/access-control-service/**'
      - 'services/people-service/test/profile.e2e-spec.ts'
      - 'services/access-control-service/tests/quality/**'
      - '.github/workflows/access-control-service-ci.yml'
      - '.github/workflows/_reusable-dotnet-ci.yml'
  pull_request:
    paths:
      - 'services/access-control-service/**'
      - 'services/people-service/test/profile.e2e-spec.ts'
      - 'services/access-control-service/tests/quality/**'
      - '.github/workflows/access-control-service-ci.yml'
      - '.github/workflows/_reusable-dotnet-ci.yml'

jobs:
  ci:
    uses: ./.github/workflows/_reusable-dotnet-ci.yml
    with:
      service_path: services/access-control-service

  sm1-coverage:
    name: Validate SM-1 coverage manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest
        run: python3 services/access-control-service/tests/quality/validate_sm1_manifest.py
